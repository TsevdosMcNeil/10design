title: Article
fields:
  -
    handle: slug
    field:
      type: text
      display: 'Column Slug'
      localizable: false
      width: 33
  -
    handle: article
    field:
      buttons:
        - h1
        - h2
        - h3
        - h4
        - h5
        - bold
        - italic
        - unorderedlist
        - orderedlist
        - quote
        - removeformat
        - anchor
        - underline
        - strikethrough
        - small
        - superscript
        - subscript
        - alignleft
        - aligncenter
        - alignright
        - alignjustify
        - color
      reading_time: true
      type: bard
      localizable: true
      display: Article
      replicator_preview: false
      validate:
        - required
      container: files
      always_save: false
      remove_empty_nodes: trim
      smart_typography: true
      sets:
        interactive:
          display: Interactive
          instructions: 'Interactive sets.'
          icon: programming-script-code
          sets:
            buttons:
              display: Buttons
              instructions: 'Add one or multiple buttons.'
              icon: link
              fields:
                -
                  import: buttons
            link_with_arrow:
              display: 'Link with arrow'
              icon: arrow-right
              fields:
                -
                  import: link_with_arrow
            links:
              display: Links
              instructions: 'Add one or multiple links.'
              icon: link
              fields:
                -
                  import: links
            contact_row:
              display: 'Contact Row'
              icon: link
              fields:
                -
                  import: contact_row
            enquire:
              display: Enquire
              icon: link
              fields:
                -
                  import: enquire
            carousel:
              display: Carousel
              icon: layout-carousel-horizontal
              fields:
                -
                  import: carousel
            photoswipe_carousel:
              display: 'Photoswipe Carousel'
              icon: layout-carousel-horizontal
              fields:
                -
                  import: photoswipe_carousel
            lightbox_person:
              display: 'Profile Card'
              icon: id-face-scan
              fields:
                -
                  import: lightbox_image
            people_list:
              display: 'People List'
              icon: id-face-scan
              fields:
                -
                  import: people_list
            project_card:
              display: 'Article Card'
              icon: id-card
              fields:
                -
                  import: project_card
            office_card:
              display: 'Office Card'
              icon: id-card
              fields:
                -
                  import: office_card
            office_employees:
              display: 'Office Employees'
              icon: list
              fields:
                -
                  import: office_employees
            scroll-triggered_related_content:
              display: 'Scroll-triggered Related Content'
              icon: flash-bolt-lightning
              fields:
                -
                  import: scroll_triggered_related_content
                  prefix: scrollcard_
            collapse:
              display: Collapse
              icon: form-drop-down-menu
              fields:
                -
                  handle: collapse_menu
                  field:
                    type: replicator
                    display: 'Collapse Menu'
                    localizable: false
                    sets:
                      new_set_group:
                        display: 'New Set Group'
                        sets:
                          collapsible_element:
                            display: 'New collapsible element'
                            icon: layout-flip-down
                            fields:
                              -
                                import: collapse
            theme_link:
              display: 'Theme Link'
              icon: link-external
              fields:
                -
                  handle: single_theme
                  field:
                    max_items: 1
                    collections:
                      - themes
                    type: entries
                    display: Theme
                    localizable: false
            form:
              display: Form
              icon: form-address-field
              fields:
                -
                  import: form
        text:
          display: Text
          instructions: 'Text based sets.'
          icon: text-formatting-initial-letter
          sets:
            pull_quote:
              display: 'Pull quote'
              instructions: 'Add a pull quote with an optional author.'
              icon: text-formatting-quotation
              fields:
                -
                  import: pull_quote
            table:
              display: Table
              instructions: 'Add a data table with headers, rows and columns.'
              icon: layout-grid-dots
              fields:
                -
                  import: table
            separator:
              display: Separator
              icon: media-image-photo-focus-frame
              fields:
                -
                  import: separator
        image_video:
          display: 'Image & video'
          instructions: "Sets with images or embeddable video's."
          icon: media-image-camera
          sets:
            image:
              display: Image
              instructions: 'Add a single image with an optional caption.'
              icon: media-image-picture-orientation
              fields:
                -
                  import: image
            video:
              display: Video
              instructions: 'Add a YouTube or Vimeo video with an optional caption.'
              icon: media-webcam-video
              fields:
                -
                  import: video
        content:
          display: Content
          icon: content-book-open
          sets:
            news_rows:
              display: 'News Rows'
              icon: globe-world-wide-web
              fields:
                -
                  import: news_rows
            idea_element:
              display: 'Idea Element'
              icon: alert-help-question
              fields:
                -
                  handle: idea
                  field:
                    max_items: 1
                    create: false
                    collections:
                      - ideas
                    type: entries
                    display: Idea
                    localizable: false
                    instructions: 'If no idea is selected, the first item from the ordered list will be displayed by default.'
            projects_grid:
              display: 'Projects Grid'
              icon: dashboard-layout
              fields:
                -
                  handle: projects
                  field:
                    collections:
                      - projects
                    type: entries
                    display: Projects
                    localizable: false
                    instructions: 'If no projects are selected, the 5 most recent projects will be displayed by default.'
                    max_items: 5
                    create: false
