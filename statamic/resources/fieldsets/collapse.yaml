title: Collapse
fields:
  -
    handle: collapse_title
    field:
      type: text
      display: Title
      width: 66
      localizable: false
  -
    handle: collapse_slug
    field:
      type: text
      display: Slug
      width: 33
      localizable: false
  -
    handle: collapse_colour
    field: common.colour
    config:
      width: 25
  -
    handle: collapse_hover_colour
    field: common.colour
    config:
      display: Hover
      width: 25
  -
    handle: arrow_hover_background_colour
    field: common.colour
    config:
      display: 'Arrow Hover Background'
      width: 25
  -
    handle: collapse_text_size
    field:
      options:
        text-base: Paragraph
        h1: H1
        h2: H2
        h3: H3
        h4: H4
        h5: H5
      default: text-base
      type: select
      display: 'Text size'
      width: 25
      localizable: false
  -
    handle: collapse_left_column
    field:
      buttons:
        - h1
        - h2
        - h3
        - h4
        - h5
        - h6
        - bold
        - italic
        - color
        - unorderedlist
        - orderedlist
        - removeformat
        - quote
        - anchor
        - image
        - table
      remove_empty_nodes: false
      type: bard
      display: 'Left column'
      width: 50
      localizable: false
      sets:
        link_with_arrow:
          display: 'Link with arrow'
          icon: arrow-right
          fields:
            -
              import: link_with_arrow
        image:
          display: Image
          instructions: 'Add a single image with an optional caption.'
          icon: media-image-picture-orientation
          fields:
            -
              import: image
        separator:
          display: Separator
          icon: media-image-photo-focus-frame
          fields:
            -
              import: separator
  -
    handle: collapse_right_column
    field:
      buttons:
        - h1
        - h2
        - h3
        - h4
        - h5
        - h6
        - bold
        - italic
        - color
        - unorderedlist
        - orderedlist
        - removeformat
        - quote
        - anchor
        - image
        - table
      remove_empty_nodes: false
      type: bard
      display: 'Right column'
      width: 50
      localizable: false
      sets:
        link_with_arrow:
          display: 'Link with arrow'
          icon: arrow-right
          fields:
            -
              import: link_with_arrow
        image:
          display: Image
          instructions: 'Add a single image with an optional caption.'
          icon: media-image-picture-orientation
          fields:
            -
              import: image
        separator:
          display: Separator
          icon: media-image-photo-focus-frame
          fields:
            -
              import: separator
