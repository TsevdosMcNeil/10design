# /etc/nginx/sites-available/10design.co
# 10Design Production  site
#
# After changes run sudo nginx -t && sudo nginx -s reload


# Map for 10sb.co old-domain redirects
map_hash_bucket_size 256;
include /etc/nginx/snippets/10sb-redirects.conf;

server {

    ## Your website name goes here.
    server_name 10design.co;
    #auth_basic           "Speak, friend, and enter";
    #auth_basic_user_file /data/webs/10Design/tpass;

    root /data/webs/10Design/public;
    ## This should be in your http block and if it is, it's not needed here.
    error_log '/var/log/nginx/10Design.log';

    # Add index.php to the list if you are using PHP
    index index.html index.htm index.php;

    # phpMyAdmin Serve static and index files
    location ^~ /phpmyadmin/ {
        root /data/webs;
        index index.php index.html index.htm;
        location ~ ^/phpmyadmin/(.+\.php)$ {
            try_files $uri =404;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include /etc/nginx/fastcgi_params;
        }
    }

    # Handle Static Cache
    set $try_location @static;

    if ($request_method != GET) {
        set $try_location @not_static;
    }

    if ($args ~* "live-preview=(.*)") {
        set $try_location @not_static;
    }

    # Redirect old News URLs (/new/) to the corrected /news/ URLs
    location ~ "^/new/(.*)$" {
        return 301 /news/$1;
    }

    location ~ "^/([a-z]{2})/new/(.*)$" {
        return 301 /$1/news/$2;
    }

    location / {
        try_files $uri $try_location;
    }

    location @static {
        try_files /static${uri}_$args.html $uri $uri/ /index.php?$args;
    }

    location @not_static {
        try_files $uri /index.php?$args;
    }

    location = /favicon.ico {
            log_not_found off;
            access_log off;
    }

    location = /robots.txt {
            allow all;
            log_not_found off;
            access_log off;
    }




    #location / {
        # First attempt to serve request as file, then
        # as directory, then fall back to displaying a 404.
    #   try_files $uri $uri/ =404;

        # This is cool because no php is touched for static content.
        # include the "?$args" part so non-default permalinks doesn't break when using query string
    #    try_files $uri $uri/ /index.php?$args;
    #}

    # pass PHP scripts to FastCGI server
    location ~ \.php$ {
        # NOTE: If errors, you should have "cgi.fix_pathinfo = 0;" in php.ini
        include snippets/fastcgi-php.conf;
        # With php-fpm (or other unix sockets):
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;

    #   # With php-cgi (or other tcp sockets):
    #   fastcgi_pass 127.0.0.1:9000;
        # FastCGI server responses with codes greater than or equal to 300
        # will be intercepted and redirected to nginx for processing with the error_page directive.
        fastcgi_intercept_errors on;
    }


    # Handle Glide image routes
    location ~ ^/img/(.*)$ {
        try_files $uri /index.php?$query_string;
    }

    # set filesize as  same value as php upload_max_filesize
    client_max_body_size 256M;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
        expires max;
        log_not_found off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/10design.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/10design.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = 10design.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name 10design.co;
    listen 80;
    return 404; # managed by Certbot


}

# Redirect www to non-www
server {
    listen 80;
    server_name www.10design.co;
    return 301 https://10design.co$request_uri;
}

server {
    listen 443 ssl;
    server_name www.10design.co;

    ssl_certificate /etc/letsencrypt/live/10design.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/10design.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://10design.co$request_uri;
}

# Rejection of connections via IP instead of domain: Block direct IP access
# This fix the problem of the homepage being added to the static cache with links directed to IP instead of domain
server {
    listen 80 default_server;
    server_name 161.35.164.126;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name 161.35.164.126;

    ssl_certificate /etc/letsencrypt/live/10design.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/10design.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 444;
}


# BEGIN 10sb.co old-domain redirects
# IMPORTANT: HTTPS redirects for 10sb.co require a valid SSL certificate for 10sb.co and www.10sb.co.
# After pointing DNS to this server, run something like:
# certbot --nginx -d 10sb.co -d www.10sb.co

server {
    server_name 10sb.co www.10sb.co;

    if ($ten_sb_redirect_target != "") {
        return 301 $ten_sb_redirect_target;
    }

    # Redirect all HTTP requests to HTTPS

    #return 301 https://10design.co$request_uri; -> This is trigering a 404  in generic cases like http://10sb.co/some-random-page/ because the $ten_sb_redirect_target is empty for this URL.

    # No more 404
    return 301 https://10design.co/;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/10sb.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/10sb.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot




}


